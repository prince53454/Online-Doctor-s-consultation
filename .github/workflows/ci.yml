name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        run: npm run build

  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Check syntax (require loads)
        working-directory: server
        run: node -e "require('./app')"

  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Run tests
        working-directory: server
        env:
          MONGODB_URI: mongodb://localhost:27017/mediconnect_test
          JWT_SECRET: test-secret-key-for-jest
        run: npm test

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build-client, build-server, test-server]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mediconnect -f server/Dockerfile .

      - name: Test container starts
        run: |
          docker run -d --name test-mongo -p 27017:27017 mongo:7
          sleep 3
          docker run -d --name test-app \
            -e MONGODB_URI=mongodb://host.docker.internal:27017/mediconnect_test \
            -e JWT_SECRET=test-secret \
            -e NODE_ENV=production \
            -p 5000:5000 \
            mediconnect || true
          sleep 5
          curl -sf http://localhost:5000/api/health || echo "Health check failed (expected without full setup)"
          docker rm -f test-app test-mongo || true
