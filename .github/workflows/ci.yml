name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        run: npm run build

  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Check syntax (require loads)
        working-directory: server
        run: node -e "require('./app')"

  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Run tests
        working-directory: server
        env:
          MONGODB_URI: mongodb://localhost:27017/mediconnect_test
          JWT_SECRET: test-secret-key-for-jest
        run: npm test

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build-client, build-server, test-server]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mediconnect -f server/Dockerfile .

      - name: Test container starts
        run: |
          set -euo pipefail
          docker network create mediconnect-ci
          cleanup() {
            docker rm -f mediconnect-app mediconnect-mongo >/dev/null 2>&1 || true
            docker network rm mediconnect-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name mediconnect-mongo \
            --network mediconnect-ci \
            --network-alias mongo \
            mongo:7

          for attempt in {1..30}; do
            if docker exec mediconnect-mongo mongosh --quiet --eval 'db.adminCommand("ping").ok' | grep -q 1; then
              break
            fi
            sleep 1
          done

          docker run -d --name mediconnect-app \
            --network mediconnect-ci \
            -e MONGODB_URI=mongodb://mongo:27017/mediconnect_test \
            -e JWT_SECRET=test_only_ci_signing_secret_at_least_32_characters \
            -e NODE_ENV=production \
            -e CLIENT_URL=http://localhost:5000 \
            -e PORT=5000 \
            -p 5000:5000 \
            mediconnect

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:5000/api/health; then
              exit 0
            fi
            sleep 1
          done

          docker logs mediconnect-app
          exit 1
