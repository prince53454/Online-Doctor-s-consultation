services:
  - type: web
    name: mediconnect-pro
    runtime: node
    plan: free
    buildCommand: cd server && npm ci && cd ../client && npm ci && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
